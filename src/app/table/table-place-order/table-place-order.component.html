   <div class="nav-bar">
    <div class="nav-item">
      <i class="pi pi-align-left"></i>
    </div>
    <div class="nav-item">
      <i class="bi bi-box-arrow-right"></i>
    </div>
  </div>

  <div class="main-container">

    <div class="card-empty" *ngIf="items.length <= 0">
        <p class="emptyCart">Empty Cart</p>
    </div>

    <div *ngFor="let item of items">
    <div class="card-order" >
      <div class="card-item">
         <img alt="Card" class="card_img" [src]="getImageSrc(item?.image)" (error)="onImageError($event)" />
        <!-- <img src="../../../assets/burger.jpg" class="item-image" alt=""> -->
        <div class="btn-group">
          <button (click)="ororderQtyDec(item)" class="qty-btn"> <i class="pi pi-minus"></i> </button>
          <input   [min]="0" [(ngModel)]="item.itemQty" [readonly]="true" class="input_qty" type="text"  pInputText />
          <button (click)="orderQtyInc(item)" class="qty-btn"><i class="pi pi-plus"></i> </button>
        </div>
      </div>
      <div class="card-item card-content">
        <p class="item-titel">{{item?.itemName}}</p>
        <p class="item-descripstion">{{item?.description}}</p>
        <p class="item-price">{{item?.amount}}</p>

        <button class="delete-btn" (click)="deleteItem(item)"><i class="pi pi-trash"></i></button>
      </div>
    </div>
    </div>

    <div class="card-order"  *ngIf="items.length > 0" >
      <button (click)="CreateOrder()" class="place-order-btn">Place Order</button>
    </div>
  </div>
